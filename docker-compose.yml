services:
  db:
    image: postgres:16-alpine
    container_name: mmo-postgres
    environment:
      POSTGRES_DB: mmo
      POSTGRES_USER: mmo
      POSTGRES_PASSWORD: mmo_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmo -d mmo"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
